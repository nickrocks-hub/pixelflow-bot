plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nickrocks.pixelflowbot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nickrocks.pixelflowbot'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    // Committed debug key, so every build from GitHub installs as an update.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: plain Android framework APIs only.
