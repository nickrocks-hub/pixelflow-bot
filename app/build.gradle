plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nickrocks.pixelflowbot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nickrocks.pixelflowbot'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '1.8'
        // The on-device model runtime ships native code; phones that can run it are 64-bit ARM.
        ndk { abiFilters 'arm64-v8a' }
    }

    // Committed debug key, so every build from GitHub installs as an update.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Candy Crush board detector, kept as the original compiled classes from build 17.
    implementation files('libs/candy-vision.jar')
    // On-device vision-language model runtime (Google LiteRT-LM). Runs models on the phone; the app
    // has no internet permission, so nothing can be sent anywhere.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
