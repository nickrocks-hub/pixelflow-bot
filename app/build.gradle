plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nickrocks.pixelflowbot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nickrocks.pixelflowbot'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.8'
    }

    // Committed debug key, so every build from GitHub installs as an update.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Candy Crush board detector, kept as the original compiled classes from build 17.
    implementation files('libs/candy-vision.jar')
}

// No other libraries: plain Android framework APIs only.
