name: Build Nick Rocks AI Bot APK

on:
  push:
    branches: [nick-rocks-ai-bot]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The AI core is plain Java: test it on the build machine before building the app.
      - name: Screen reader check on real game frames
        run: |
          mkdir -p out
          javac -d out app/src/main/java/com/nickrocks/aibot/core/*.java tools/*.java
          java -Djava.awt.headless=true -cp out VisionCheck tools/samples

      - name: Simulator scenario tests
        run: java -cp out SimTests scenarios simwork 2>&1 | tee scenarios.log

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "error:|e: |FAILURE|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NICK-ROCKS-AI-BOT-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NICK-ROCKS-AI-BOT-${{ github.run_number }}
          path: |
            NICK-ROCKS-AI-BOT-${{ github.run_number }}.apk
            scenarios.log

      # Direct .apk download link that works from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nick-rocks-ai-bot-build-${{ github.run_number }}
          name: Nick Rocks AI Bot build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: NICK-ROCKS-AI-BOT-${{ github.run_number }}.apk
