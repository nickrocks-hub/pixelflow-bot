name: Build AI GAME SUBWAY SURFERS APK

on:
  push:
    branches: [subwaysurfers]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "error:|e: |FAILURE|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-GAME-SUBWAY-SURFERS-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-GAME-SUBWAY-SURFERS-${{ github.run_number }}
          path: AI-GAME-SUBWAY-SURFERS-${{ github.run_number }}.apk

      # Direct .apk download link that works from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: subwaysurfers-build-${{ github.run_number }}
          name: AI GAME SUBWAY SURFERS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: AI-GAME-SUBWAY-SURFERS-${{ github.run_number }}.apk
